<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="12" fill="#070709"/>
  <!-- Gold circular aperture / lens ring -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="#c9a96e" stroke-width="2.5"/>
  <circle cx="32" cy="32" r="14" fill="#141419" stroke="#dfc287" stroke-width="1.5"/>
  <!-- Anamorphic lens flare streak -->
  <line x1="8" y1="32" x2="56" y2="32" stroke="#c9a96e" stroke-width="1" stroke-opacity="0.6"/>
  <!-- Aperture iris lines -->
  <line x1="32" y1="18" x2="42" y2="26" stroke="#c9a96e" stroke-width="1.5"/>
  <line x1="42" y1="26" x2="40" y2="38" stroke="#c9a96e" stroke-width="1.5"/>
  <line x1="40" y1="38" x2="28" y2="44" stroke="#c9a96e" stroke-width="1.5"/>
  <line x1="28" y1="44" x2="20" y2="36" stroke="#c9a96e" stroke-width="1.5"/>
  <line x1="20" y1="36" x2="24" y2="24" stroke="#c9a96e" stroke-width="1.5"/>
  <line x1="24" y1="24" x2="32" y2="18" stroke="#c9a96e" stroke-width="1.5"/>
  <!-- Center lens glass highlight -->
  <circle cx="32" cy="32" r="5" fill="#dfc287"/>
</svg>
